apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-survey-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: portal-survey-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: portal-survey
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-survey-ui
      app.kubernetes.io/component: ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-survey-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: portal-survey
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.version }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.ui.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ui.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}